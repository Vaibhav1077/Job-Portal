version: "3.8"

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - job-service
      - payment-service
      - utils-service

  user-service:
    build: ./services/user
    ports:
      - "4001:4001"
    env_file:
      - ./services/user/.env
    depends_on:
      - utils-service

  job-service:
    build: ./services/job
    ports:
      - "4002:4002"
    env_file:
      - ./services/job/.env
    depends_on:
      - kafka
      - utils-service

  payment-service:
    build: ./services/payment
    ports:
      - "4003:4003"
    env_file:
      - ./services/payment/.env

  utils-service:
    build: ./services/utils
    ports:
      - "4004:4004"
    env_file:
      - ./services/utils/.env
    depends_on:
      - kafka

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
